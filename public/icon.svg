<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="80%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Phone Mockup Body -->
  <g transform="translate(146, 76)">
    <!-- Outer phone frame -->
    <rect x="0" y="0" width="220" height="360" rx="42" fill="#030712" stroke="#475569" stroke-width="4" />
    <rect x="3" y="3" width="214" height="354" rx="39" fill="url(#phoneGrad)" opacity="0.3" />

    <!-- Screen with aesthetic wallpaper -->
    <rect x="10" y="10" width="200" height="340" rx="32" fill="url(#screenGrad)" />

    <!-- Dynamic wallpaper art shapes inside screen -->
    <circle cx="100" cy="130" r="46" fill="#f43f5e" opacity="0.85" />
    <path d="M 20 280 Q 70 200 120 240 T 190 220 L 190 330 L 10 330 Z" fill="#4f46e5" opacity="0.9" />
    <path d="M 40 310 Q 100 250 150 280 T 190 270 L 190 330 L 30 330 Z" fill="#06b6d4" opacity="0.75" />

    <!-- Notch / Dynamic Island -->
    <rect x="75" y="18" width="70" height="14" rx="7" fill="#020617" />

    <!-- Glowing sparkle stars -->
    <path d="M 60 90 Q 60 105 75 105 Q 60 105 60 120 Q 60 105 45 105 Q 60 105 60 90 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M 155 70 Q 155 80 165 80 Q 155 80 155 90 Q 155 80 145 80 Q 155 80 155 70 Z" fill="#38bdf8" opacity="0.95" />
  </g>
</svg>
